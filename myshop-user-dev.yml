server:
  port: 9003

spring:
  application:
    name: myshop-user
  datasource:
    # 将端口从3306改为3307
    url: jdbc:mysql://192.168.221.136:3307/springcloud?characterEncoding=UTF8&useSSL=false
    username: root
    password: 123456
eureka:
  client:
    register-with-eureka: true # 作为客户端需要注册到Eureka
    fetch-registry: true  # 作为客户端需要从Eureka获取注册信息
    service-url: # 客户端注册地址
      defaultZone: http://localhost:8888/eureka
  instance:
  # 优先使用该服务的IP地址注册到Eureka，在生产环境建议改为true
prefer-ip-address: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html